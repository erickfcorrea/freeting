<svg
  width="880"
  height="160"
  viewBox="0 0 880 160"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
  role="img"
  aria-label="FREETING"
>
  <defs>
    <!-- High-Contrast Champagne Gold & Brushed Platinum Gradient (Valid SVG kebab-case stop-color!) -->
    <linearGradient id="antiqueGold" x1="0" y1="22" x2="880" y2="138" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFF3D1" />
      <stop offset="22%" stop-color="#E6C365" />
      <stop offset="48%" stop-color="#FFFDF5" />
      <stop offset="74%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#F7E3A1" />
    </linearGradient>

    <!-- Chiseled Bevel Edge Gradient (Ensures visibility on both Dark #0d1117 and Light #ffffff) -->
    <linearGradient id="chiselEdge" x1="0" y1="20" x2="0" y2="140" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#B8860B" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#5C4008" stop-opacity="0.95" />
    </linearGradient>

    <filter id="monumentalShadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.65" />
    </filter>
  </defs>

